# Smithery configuration file for Chirak MCP Server
# https://smithery.ai/docs

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        description: "Your Chirak API Key (starts with chk_live_)"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'chirak-mcp'],
      env: {
        CHIRAK_API_KEY: config.apiKey
      }
    })
  exampleConfig:
    apiKey: "chk_live_YOUR_API_KEY_HERE"
